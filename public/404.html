<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>HormigApp - Redireccionando...</title>
    <script>
      // SPA Redirect: Guarda la ruta original y redirige a index.html
      // index.html cargará React Router que manejará la ruta correcta
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var fullPath = l.pathname + l.search + l.hash;
      // Redirigir a la raíz con la ruta como query parameter
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    Redireccionando...
  </body>
</html>
